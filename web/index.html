<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ray GTP</title>
<style>
  body { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; }
  input { width: 70%; }
  textarea { box-sizing: border-box; width: 100%; height: 28rem; margin-top: 1rem; font-family: monospace; }
</style>
<h1>Ray GTP</h1>
<p id="status">エンジンとパラメータを読み込み中…</p>
<form id="commands">
  <fieldset id="controls" disabled>
    <input id="command" aria-label="GTPコマンド" value="name" autocomplete="off">
    <button>送信</button>
    <p>
      <button type="button" data-command="genmove b">genmove b</button>
      <button type="button" data-command="genmove w">genmove w</button>
      <button type="button" data-command="showboard">showboard</button>
      <button type="button" data-command="clear_board">clear_board</button>
      <button type="button" data-command="boardsize 9">9×9</button>
      <button type="button" data-command="boardsize 19">19×19</button>
    </p>
  </fieldset>
</form>
<textarea id="output" aria-label="GTP出力" readonly></textarea>
<script>
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  function print(text) {
    output.value += text + '\n';
    output.scrollTop = output.scrollHeight;
  }
  var Module = {
    arguments: ['--const-time', '1', '--tree-size', '4096'],
    print: print,
    printErr: print,
    setStatus: function(text) { if (text) status.textContent = text; },
    onAbort: function(reason) { status.textContent = '読み込み失敗: ' + reason; }
  };
  document.getElementById('commands').addEventListener('submit', function(event) {
    event.preventDefault();
    send(document.getElementById('command').value);
  });
  document.querySelectorAll('[data-command]').forEach(function(button) {
    button.addEventListener('click', function() { send(button.dataset.command); });
  });
  function send(command) {
    print('> ' + command);
    try { Module.GTP_exec(command); }
    catch (error) { print(String(error)); }
  }
</script>
<script src="ray.js"></script>
<script>
  Module.ready.then(function() {
    document.getElementById('controls').disabled = false;
    status.textContent = '準備完了';
  }).catch(function(error) { status.textContent = String(error); });
</script>
</html>
